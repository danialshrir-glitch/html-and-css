<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Second form</title>
    </head>
    <body>
        <form>
            <h2>Edit your preferences</h2>
            <ul>
                <li>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        name="email"
                        id="email" />
                </li>
                <li>
                    <label for="website">Website</label>
                    <input
                        type="url"
                        name="website"
                        id="website" />
                </li>
                <li>
                    <label for="phone">Phone number</label>
                    <input
                        type="tel"
                        name="phone"
                        id="phone" />
                </li>
                <li>
                    <label for="fave-color">Favorite color</label>
                    <input
                        type="color"
                        name="fave-color"
                        id="fave-color" />
                </li>
            </ul>
        </form>
    </body>
</html>
