<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sizing a blog page challenge</title>
        <link href="styles/styles.css" rel="stylesheet" />
    </head>
    <body>
        <div class="wrapper">
            <div class="box">
                <img
                    alt="star"
                    class="width"
                    src="https://mdn.github.io/shared-assets/images/examples/big-star.png" />
            </div>
            <div class="box">
                <img
                    alt="star"
                    class="max"
                    src="https://mdn.github.io/shared-assets/images/examples/big-star.png" />
            </div>
            <div class=" box mini-box">
                <img
                    alt="star"
                    class="max"
                    src="https://mdn.github.io/shared-assets/images/examples/big-star.png" />
            </div>
        </div>
    </body>
</html>
