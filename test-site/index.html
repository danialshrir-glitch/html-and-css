<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Second form</title>
    </head>
    <body>
        <form>
            <fieldset>
                <legend>Personal details:</legend>
                <div>
                    <ul>
                        <li>
                            <label for="name">Name:</label>
                            <input
                                type="text"
                                id="name"
                                name="name" />
                        </li>
                        <li>
                            <label for="age">Age:</label>
                            <input
                                type="number"
                                id="age"
                                name="age" />
                        </li>
                    </ul>
                </div>
            </fieldset>

            <fieldset>
                <legend>Comment information</legend>
                <div>
                    <ul>
                        <li>
                            <label for="comment">Comment:</label>
                            <input
                                type="text"
                                id="comment"
                                name="comment" />
                        </li>
                        <li>
                            <label for="email">Email (include if you want a reply):</label>
                            <input
                                type="email"
                                id="email"
                                name="email" />
                        </li>
                    </ul>
                </div>
            </fieldset>
        </form>
    </body>
</html>
