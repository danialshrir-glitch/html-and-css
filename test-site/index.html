<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Second form</title>
    </head>
    <body>
        <form>
            <fieldset>
                <legend>Who is your favorite pony?</legend>
                <div>
                    <ul>
                        <li>
                            <label for="pinkie">Pinkie pie</label>
                            <input
                                type="radio"
                                id="ponyType1"
                                name="pony"
                                value="pinkie"
                                checked />
                        </li>
                        <li>
                            <label for="rainbow">Rainbow Dash</label>
                            <input
                                type="radio"
                                id="ponyType2"
                                name="pony"
                                value="rainbow" />
                        </li>
                        <li>
                            <label for="twilight">Twilight Sparkle</label>
                            <input
                                type="radio"
                                id="ponyType3"
                                name="pony"
                                value="twilight" />
                        </li>
                    </ul>
                </div>
            </fieldset>
            <fieldset>
                <legend>Hotdog preferences</legend>
                <div>
                    <ul>
                        <li>
                            <label for="vegan">Vegan</label>
                            <input
                                type="checkbox"
                                id="vegan"
                                name="vegan" />
                        </li>
                        <li>
                            <label for="onions">Onions</label>
                            <input
                                type="checkbox"
                                id="onions"
                                name="onions" />
                        </li>
                        <li>
                            <label for="mustard">Mustard</label>
                            <input
                                type="checkbox"
                                id="mustard"
                                name="mustard" />
                        </li>
                        <li>
                            <label for="ketchup">Ketchup</label>
                            <input
                                type="checkbox"
                                id="ketchup"
                                name="ketchup" />
                        </li>
                    </ul>
                </div>
            </fieldset>
        </form>
    </body>
</html>
